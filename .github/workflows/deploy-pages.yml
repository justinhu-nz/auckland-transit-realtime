name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject CARTO API key
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          if [ -z "$CARTO_API_KEY" ]; then
            echo "::error::CARTO_API_KEY secret is not set"
            exit 1
          fi
          python3 - <<'PY'
          import os
          key = os.environ["CARTO_API_KEY"].strip()
          for path in ["index.html"]:
              with open(path) as f:
                  s = f.read()
              assert "__CARTO_API_KEY__" in s, f"placeholder missing in {path}"
              with open(path, "w") as f:
                  f.write(s.replace("__CARTO_API_KEY__", key))
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
