<!DOCTYPE html>
<html lang="en">
<head>
    <title>AT Transit Realtime</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.5.1/dist/leaflet.css"
        integrity="sha512-xwE/Az9zrjBIphAcBb3F6JVqxf46+CDLwfLMHloNu6KEQCAWi6HcDUbeOfBIptF7tcCzusKFjFw2yuvEpDL9wQ=="
        crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.5.1/dist/leaflet.js"
        integrity="sha512-GffPMF3RvMeYyc1LWMHtK8EbPv0iNZ8/oTtHPx9/cc2ILxQ+u905qIwdpULaqDkyBKgOaB57QTMg7ztg8Jm2Og=="
        crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-providers@1.3.0/leaflet-providers.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.0.3/chroma.min.js"></script>
    <style>
        :root { --fg: #222; --muted: #777; --line: #e3e3e3; --accent: #0078a8; --panel: #fff; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--fg); }
        #map { position: absolute; inset: 0; }
        .leaflet-container { font: inherit; }
        .panel {
            background: var(--panel); border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,.25);
        }

        /* Search */
        .find { width: 320px; }
        .find-box { display: flex; align-items: center; padding: 0 10px; gap: 6px; }
        .find-box svg { width: 16px; height: 16px; flex: none; stroke: var(--muted); fill: none; stroke-width: 2.2; stroke-linecap: round; }
        #find-input {
            flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
            font: inherit; padding: 10px 0; color: var(--fg);
        }
        #find-clear { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px; display: none; }
        #find-results { max-height: 50vh; overflow-y: auto; border-top: 1px solid var(--line); display: none; }
        .res-head { padding: 6px 12px 2px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
        .res { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; }
        .res:hover, .res.active { background: #f2f6f9; }
        .res .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .res .txt { min-width: 0; }
        .res-empty { padding: 10px 12px; color: var(--muted); }
        .badge {
            display: inline-block; min-width: 18px; padding: 1px 6px; border-radius: 4px;
            color: #fff; font-weight: 600; font-size: 12px; text-align: center; flex: none;
            text-shadow: 0 0 2px rgba(0,0,0,.35);
        }
        #chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
        #chips:empty { display: none; }
        .chip {
            display: inline-flex; align-items: center; gap: 4px; background: #fff;
            border-radius: 14px; padding: 3px 4px 3px 10px; font-size: 13px;
            box-shadow: 0 1px 3px rgba(0,0,0,.25);
        }
        .chip button { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; padding: 0 4px; }
        .chip.clear { padding-right: 10px; cursor: pointer; color: var(--accent); }

        /* Icon buttons */
        .btns { display: flex; flex-direction: column; overflow: hidden; }
        .btns button {
            width: 36px; height: 36px; border: 0; background: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center; padding: 0;
        }
        .btns button + button { border-top: 1px solid var(--line); }
        .btns button:hover { background: #f4f4f4; }
        .btns svg { width: 18px; height: 18px; fill: none; stroke: #444; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .btns button.on svg { stroke: var(--accent); }
        .btns button.on #locate-dot { fill: var(--accent); }
        .btns button.busy svg { animation: spin .9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .leaflet-touch .leaflet-control-layers, .leaflet-touch .leaflet-bar { border: 0; box-shadow: 0 1px 4px rgba(0,0,0,.25); border-radius: 8px; }
        .leaflet-touch .leaflet-bar a:first-child { border-radius: 8px 8px 0 0; }
        .leaflet-touch .leaflet-bar a:last-child { border-radius: 0 0 8px 8px; }

        /* Status */
        .status { font-weight: 400; font-size: 12px; color: var(--muted); margin-right: 10px; }
        #find-input::-webkit-search-cancel-button { -webkit-appearance: none; }
        .status.err { color: #c0392b; }

        /* Options panel */
        .opts { width: 240px; }
        #opts-toggle {
            display: flex; align-items: center; justify-content: space-between; width: 100%;
            border: 0; background: none; font: inherit; font-weight: 600; padding: 9px 12px; cursor: pointer; color: var(--fg);
        }
        #opts-toggle .chev { transition: transform .15s; color: var(--muted); }
        .opts.open #opts-toggle .chev { transform: rotate(180deg); }
        #opts-body { display: none; padding: 0 12px 12px; max-height: 55vh; overflow-y: auto; }
        .opts.open #opts-body { display: block; }
        .opts label.row { display: flex; align-items: center; gap: 6px; padding: 3px 0; cursor: pointer; }
        .opts .sec { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 10px 0 4px; }
        #colourscheme { width: 100%; font: inherit; padding: 5px; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
        #key { margin-top: 6px; font-size: 12px; color: #555; }
        #key div { display: flex; align-items: center; gap: 6px; }
        #key .bar { height: 8px; border-radius: 4px; margin: 4px 0 2px; }
        #key .ends { display: flex; justify-content: space-between; color: var(--muted); }
        .indent { margin-left: 20px; }
        .link { color: var(--accent); cursor: pointer; font-size: 12px; user-select: none; }

        /* Vehicle popup */
        .leaflet-popup-content-wrapper { border-radius: 8px; }
        .leaflet-popup-content { margin: 10px 12px; min-width: 200px; }
        .vp-h { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
        .vp-meta { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
        .vp-grid { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; }
        .vp-grid span:nth-child(odd) { color: var(--muted); }
        .vp-follow { margin-top: 8px; font-size: 12px; }
        .me-dot { fill: #1a73e8; stroke: #fff; }

        @media (pointer: coarse), (max-width: 600px) {
            .find { width: calc(100vw - 20px - 56px - env(safe-area-inset-left) - env(safe-area-inset-right)); }
            #find-input { font-size: 16px; padding: 12px 0; }
            .res { padding: 11px 12px; }
            .btns button { width: 44px; height: 44px; }
            .btns svg { width: 20px; height: 20px; }
            .leaflet-control-zoom { display: none; }
            .leaflet-control-layers-toggle { width: 44px !important; height: 44px !important; }
            .leaflet-control-layers-expanded { max-height: 60vh; overflow-y: auto; }
            .leaflet-control-layers label { padding: 6px 0; font-size: 15px; }
            .opts { width: calc(100vw - 20px - env(safe-area-inset-left) - env(safe-area-inset-right)); max-width: 360px; }
            .opts label.row { padding: 7px 0; font-size: 15px; }
            .opts input[type=checkbox] { width: 18px; height: 18px; }
            #colourscheme { font-size: 16px; padding: 8px; }
            .chip { font-size: 14px; padding: 5px 6px 5px 12px; }
            .leaflet-control-attribution { max-width: 60vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .leaflet-top { padding-top: env(safe-area-inset-top); }
            .leaflet-bottom { padding-bottom: env(safe-area-inset-bottom); }
            .leaflet-left { padding-left: env(safe-area-inset-left); }
            .leaflet-right { padding-right: env(safe-area-inset-right); }
        }
    </style>

</head>
<body>
<div id="map"></div>
<script>
var AT_KEY = '6cb37daf7f5c4feda39bbf640e892074';
var AT_HEADERS = { 'Cache-Control': 'no-cache', 'Ocp-Apim-Subscription-Key': AT_KEY };
var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
var isSmall = function () { return window.matchMedia('(max-width: 600px)').matches; };

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}
function $id(id) { return document.getElementById(id); }

var map = L.map('map', {
    center: [-36.8862, 174.7651],
    zoom: 12,
    zoomControl: false,
    tap: true
});

// ---------- Base maps ----------
// CARTO basemaps now require an API key. The placeholder below is replaced
// at deploy time by the GitHub Actions workflow using the CARTO_API_KEY secret.
var CARTO_API_KEY = '__CARTO_API_KEY__';
var hasCartoKey = CARTO_API_KEY && CARTO_API_KEY.indexOf('__') !== 0;
function cartoLayer(style) {
    return L.tileLayer('https://{s}.basemaps.cartocdn.com/' + style + '/{z}/{x}/{y}{r}.png?key=' + encodeURIComponent(CARTO_API_KEY), {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20
    });
}
var positron = cartoLayer('light_all');
var osm = L.tileLayer.provider('OpenStreetMap.Mapnik');
// Without a key (e.g. opening the file locally) CARTO tiles are watermarked, so default to OSM
(hasCartoKey ? positron : osm).addTo(map);

var baseMaps = {
    'CartoDB Positron': positron,
    'CartoDB Dark Matter': cartoLayer('dark_all'),
    'OSM': osm,
    'OSM Grayscale': L.tileLayer.provider('OpenStreetMap.BlackAndWhite'),
    'ESRI WorldImagery': L.tileLayer.provider('Esri.WorldImagery'),
    'Google Hybrid': L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
        maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
    }),
    'Wikimedia': L.tileLayer.provider('Wikimedia')
};
map.attributionControl.addAttribution("© <a href='https://dev-portal.at.govt.nz/'>AT</a>");

var layers = {
    2: L.layerGroup().addTo(map),
    3: L.layerGroup().addTo(map),
    4: L.layerGroup().addTo(map),
    null: L.layerGroup(),
    oos_bus: L.layerGroup().addTo(map),
    oos_train: L.layerGroup().addTo(map),
    oos_ferry: L.layerGroup().addTo(map)
};
var overlayMaps = {
    'Buses': layers[3],
    'Trains': layers[2],
    'Ferries': layers[4],
    'Out of service buses': layers.oos_bus,
    'Out of service trains': layers.oos_train,
    'Out of service ferries': layers.oos_ferry,
    'Other / unknown': layers[null]
};

// ---------- State ----------
var markers = {};          // entity id -> circleMarker
var routes = {};           // route id -> attributes
var tripCache = {};        // trip id -> attributes
var selectedId = null;     // vehicle with open popup
var followId = null;       // vehicle the map is following
var activeRoutes = new Set();
var colourscheme = 'Route';

// ---------- Operators ----------
var operatorPrefixes = {
    'NB': 'Kinetic', 'GB': 'Kinetic', 'HE': 'Howick and Eastern', 'BA': 'Bayes',
    'RT': 'Ritchies', 'PC': 'Pavlovich', 'TR': 'Tranzurban', 'WB': 'Waiheke Bus Co'
};
var operatorColors = {
    'Kinetic': '#7b2d8b', 'Howick and Eastern': '#d62828', 'Bayes': '#2a9d8f',
    'Ritchies': '#e6b800', 'Pavlovich': '#e76f51', 'Tranzurban': '#48bfe3',
    'Waiheke Bus Co': '#264653', 'Auckland One Rail': '#77BCA7', 'Unknown': '#888888'
};
var allOperatorNames = Object.keys(operatorColors);
var kineticSubs = { 'NB': { name: 'NZ Bus', color: '#9b59b6' }, 'GB': { name: 'Go Bus', color: '#5b2c6f' } };
var activeOperators = new Set(allOperatorNames);
var activeKineticSubs = new Set(['NB', 'GB']);
var splitKinetic = false;

function getOperator(label) {
    if (!label) return 'Unknown';
    return operatorPrefixes[label.substring(0, 2).toUpperCase()] || 'Unknown';
}

// ---------- Colours ----------
var routeColors = {
            '101':'#00B0C1','105':'#7A599D','106':'#37628C','111':'#E6A400','112':'#ED6E9C',
            '114':'#B75671','116':'#DE5227','11T':'#26B8EB','11W':'#26B8EB','12':'#00975F',
            '122':'#F49EC4','123':'#F49EC4','125':'#9373B1','126':'#BCCF00','128':'#009A93',
            '13':'#7CC8C5','132':'#C4816C','135':'#F26522','14':'#E4032E','143':'#946AAB',
            '145':'#D8458E','147':'#ADA335','148':'#8D0055','149':'#F9A131','152':'#00A6DE',
            '154':'#8EC89A','161':'#9F649A','162':'#D7AF00','170':'#919F3C','171':'#00664D',
            '172':'#A22D63','18':'#0069B4','186':'#924F63','191':'#E77D95','195':'#718A7E',
            '20':'#D7007F','209':'#15AF97','22N':'#AE7DA8','22R':'#AE7DA8','24B':'#0093C5',
            '24R':'#0093C5','252':'#B45322','253':'#B45322','25B':'#B5511B','25L':'#B5511B',
            '27H':'#3FA5BD','27T':'#3FA5BD','27W':'#3FA5BD','295':'#8C895F','298':'#4C7BBE',
            '30':'#7482B0','309':'#573A66','309X':'#573A66','311':'#2596be','31':'#B55611',
            '313':'#95C11F','314':'#78CAE1','32':'#E83C7A','321':'#951B81','323':'#3ABDDE',
            '324':'#00887B','325':'#946AAB','326':'#8BADDC','33':'#0069B4','35':'#1E894F',
            '351':'#B7A86C','352':'#00975F','353':'#AA026D','355':'#D6606F','36':'#A42523',
            '361':'#EA5623','362':'#5C3E24','363':'#539326','365':'#D73E86','366':'#89CCCA',
            '372':'#8EC89A','373':'#E74011','376':'#B75671','377':'#457B6E','378':'#F39200',
            '38':'#009AC2','391':'#F39200','392':'#95C11F','393':'#00B1EB','394':'#A16D0B',
            '395':'#946AAB','396':'#DC5054','399':'#007E6B','501':'#FDC100','502':'#E30613',
            '503':'#009FE3','50A':'#164194','50B':'#27A737','64':'#EF7F97','65':'#8B588D',
            '66':'#1B8941','67A':'#383882','67B':'#383882','68':'#925C8D','70':'#CF1619',
            '70H':'#FDB913','711':'#51AEE2','712':'#6F4092','72C':'#005F9C','72M':'#005F9C',
            '72X':'#005F9C','733':'#3D9B7D','734':'#ED6C77','735':'#FBBA00','738':'#2596be',
            '739':'#7B9CCC','74':'#F59D24','744':'#6EB486','747':'#EF7E86','75':'#770F00',
            '751':'#008788','755':'#71C8DC','76':'#9F4C97','774':'#C2A712','775':'#C2A712',
            '781':'#F7A600','782':'#95C11F','783':'#E84250','801':'#007B77','802':'#B27A22',
            '805':'#5C7DBF','806':'#94604C','807':'#EE7656','814':'#B0BA30','82':'#9D3A7F',
            '83':'#CE1531','842':'#286FA3','843':'#F59C00','845':'#00A0DD','856':'#EE7566',
            '861':'#966B45','865':'#64105B','866':'#FDC61E','871':'#00A79B','871A':'#00A79B',
            '878':'#0095D4','883':'#D676AD','884':'#8E66AB','885':'#9662A5','888':'#9662A5',
            '889':'#13A538','901':'#8BADDC','902':'#2596be','906':'#BBD043','907':'#5C3E24',
            '917':'#406C95','923':'#0D9EA2','924':'#5E3668','926':'#677769','928':'#C89C2F',
            '931':'#78363C','933':'#D0559A','939':'#29694A','94':'#FF0000','941':'#977EAF',
            '95B':'#EE7323','95C':'#EE7323','966':'#67A65C','97B':'#00B3EC','97R':'#00B3EC',
            '981':'#E63027','982':'#91273E','983':'#2581C4','984':'#95C11F','985':'#F2B420',
            '986':'#EA5B0C','988':'#F18700','989':'#A84693','995':'#F18700','996':'#D51130',
            '997':'#329248','998':'#7263A9','999':'#7263A9','AIR':'#F39200','CTY':'#E30613',
            'INN':'#56AF31','N10':'#EE2E27','NX1':'#1F3685','NX2':'#007C34','OUT':'#F39200',
            'TMK':'#0086C7','AT Local':'#89AD3F','WX1':'#00843C',
            'EAST':'#fdb913','STH':'#ee2e27','ONE':'#00aaef','WEST':'#97c93d',
            'HUIA':'#ff0000'
        };

var occupancy = ['Empty', 'Many seats', 'Few seats', 'Standing room', 'Limited standing', 'Full', 'Not accepting passengers'];
var occupancyColors = ['#4575b4', '#91bfdb', '#e0f3f8', '#fee090', '#fc8d59', '#d73027', 'black'];
var speedColors = chroma.scale([chroma.hsv(270, 1, 1), chroma.hsv(180, 1, 1), chroma.hsv(90, 1, 1), chroma.hsv(0, 1, 1)]).mode('hsv').domain([0, 100]);
var typeColors = { 2: 'orange', 3: 'blue', 4: 'green' };

function stringToColour(str) {
    var hash = 0;
    for (var i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
    var colour = '#';
    for (var j = 0; j < 3; j++) colour += ('00' + ((hash >> (j * 8)) & 0xFF).toString(16)).substr(-2);
    return colour;
}

function routeColour(shortName, longName, type) {
    if (routeColors[shortName]) return routeColors[shortName];
    if (type == 4) return 'blue';
    if (longName) return stringToColour(longName);
    return '#555';
}

function markerColour(m) {
    switch (colourscheme) {
        case 'Type': return typeColors[m.vehicle_type] || 'black';
        case 'Occupancy': return m.occupancy_status != null ? occupancyColors[m.occupancy_status] : 'black';
        case 'Speed': return speedColors(m.speed || 0).hex();
        case 'Operator':
            if (m.operator === 'Auckland One Rail' && m.route_short_name === 'HUIA') return '#ff0000';
            if (m.operator === 'Kinetic' && splitKinetic && kineticSubs[m.prefix]) return kineticSubs[m.prefix].color;
            return operatorColors[m.operator] || operatorColors.Unknown;
        default:
            return m.route_short_name || m.route_long_name
                ? routeColour(m.route_short_name, m.route_long_name, m.route_type) : 'black';
    }
}

// ---------- Visibility ----------
function isVisible(m) {
    if (m._entityId === selectedId) return true;
    if (!activeOperators.has(m.operator)) return false;
    if (m.operator === 'Kinetic' && kineticSubs[m.prefix] && !activeKineticSubs.has(m.prefix)) return false;
    if (activeRoutes.size && !activeRoutes.has(m.route_short_name || m.route_long_name)) return false;
    return true;
}

function styleMarker(m) {
    var vis = isVisible(m);
    var c = markerColour(m);
    m.setStyle({
        color: c, fillColor: c,
        opacity: vis ? 1 : 0,
        fillOpacity: vis ? 0.45 : 0,
        weight: m._entityId === selectedId ? 4 : 2
    });
    if (m._path) m._path.style.pointerEvents = vis ? '' : 'none';
}
function restyleAll() { for (var id in markers) styleMarker(markers[id]); }

// ---------- Hash state (shareable: #c=Route&r=70,NX1) ----------
function readHash() {
    var h = location.hash.slice(1);
    if (!h) return;
    if (h.indexOf('=') < 0) { colourscheme = decodeURIComponent(h); return; } // legacy "#Speed"
    h.split('&').forEach(function (kv) {
        var p = kv.split('='), v = decodeURIComponent(p[1] || '');
        if (p[0] === 'c' && v) colourscheme = v;
        if (p[0] === 'r' && v) v.split(',').forEach(function (r) { if (r) activeRoutes.add(r); });
    });
}
function writeHash() {
    var h = 'c=' + encodeURIComponent(colourscheme);
    if (activeRoutes.size) h += '&r=' + Array.from(activeRoutes).map(encodeURIComponent).join(',');
    history.replaceState(null, '', '#' + h);
}
readHash();

// ---------- Controls ----------
var ICONS = {
    search: '<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg>',
    locate: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle id="locate-dot" cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
    refresh: '<svg viewBox="0 0 24 24"><path d="M21 3v6h-6"/><path d="M3 12a9 9 0 0 1 15.5-6.2L21 9"/><path d="M3 21v-6h6"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 15"/></svg>'
};

function control(position, build) {
    var C = L.Control.extend({
        options: { position: position },
        onAdd: function () {
            var el = build();
            L.DomEvent.disableClickPropagation(el);
            L.DomEvent.disableScrollPropagation(el);
            return el;
        }
    });
    return new C().addTo(map);
}

// Search / find
control('topleft', function () {
    var wrap = L.DomUtil.create('div', 'find');
    wrap.innerHTML =
        '<div class="panel"><div class="find-box">' + ICONS.search +
        '<input id="find-input" type="search" placeholder="Find route, vehicle or plate" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="search">' +
        '<button id="find-clear" aria-label="Clear">&times;</button></div>' +
        '<div id="find-results"></div></div>' +
        '<div id="chips"></div>';
    return wrap;
});

// Layers + buttons on the right
L.control.layers(baseMaps, overlayMaps, { position: 'topright' }).addTo(map);
control('topright', function () {
    var el = L.DomUtil.create('div', 'btns panel');
    el.innerHTML =
        '<button id="btn-locate" title="Show my location" aria-label="Show my location">' + ICONS.locate + '</button>' +
        '<button id="btn-refresh" title="Refresh now" aria-label="Refresh now">' + ICONS.refresh + '</button>';
    return el;
});
if (!isTouch) L.control.zoom({ position: 'topright' }).addTo(map);

// Options
control('bottomright', function () {
    var el = L.DomUtil.create('div', 'opts panel' + (isSmall() ? '' : ' open'));
    el.id = 'opts';
    var ops = allOperatorNames.map(function (op) {
        var row = '<label class="row"><input type="checkbox" class="op-cb" data-op="' + esc(op) + '" checked>' +
            '<span class="dot" style="background:' + operatorColors[op] + '"></span>' + esc(op) + '</label>';
        if (op === 'Kinetic') {
            row += '<div class="indent"><span class="link" id="kinetic-toggle">Split NZ Bus / Go Bus</span><div id="kinetic-sub" style="display:none">';
            for (var p in kineticSubs) {
                row += '<label class="row"><input type="checkbox" class="ks-cb" data-prefix="' + p + '" checked>' +
                    '<span class="dot" style="background:' + kineticSubs[p].color + '"></span>' + kineticSubs[p].name + '</label>';
            }
            row += '</div></div>';
        }
        return row;
    }).join('');
    el.innerHTML =
        '<button id="opts-toggle"><span id="status" class="status">Loading…</span><span>Display <span class="chev">&#9662;</span></span></button>' +
        '<div id="opts-body">' +
        '<div class="sec">Colour by</div>' +
        '<select id="colourscheme"><option>Route</option><option>Type</option><option>Occupancy</option><option>Speed</option><option>Operator</option></select>' +
        '<div id="key"></div>' +
        '<div class="sec">Operators</div>' +
        '<label class="row"><input type="checkbox" id="op-all" checked><b>All</b></label>' + ops +
        '</div>';
    return el;
});

// ---------- Options wiring ----------
$id('opts-toggle').onclick = function () { $id('opts').classList.toggle('open'); };
$id('colourscheme').value = colourscheme;
$id('colourscheme').onchange = function () {
    colourscheme = this.value;
    writeHash(); renderKey(); restyleAll();
};

function renderKey() {
    var k = $id('key'), html = '';
    function sw(c, t) { return '<div><span class="dot" style="background:' + c + '"></span>' + t + '</div>'; }
    if (colourscheme === 'Type') html = sw('orange', 'Train') + sw('blue', 'Bus') + sw('green', 'Ferry');
    else if (colourscheme === 'Occupancy') html = occupancy.slice(0, 6).map(function (t, i) { return sw(occupancyColors[i], t); }).join('');
    else if (colourscheme === 'Speed') html = '<div class="bar" style="background:linear-gradient(90deg,' +
        [0, 25, 50, 75, 100].map(function (v) { return speedColors(v).hex(); }).join(',') +
        ')"></div><div class="ends"><span>0</span><span>50</span><span>100+ km/h</span></div>';
    k.innerHTML = html;
}
renderKey();

function syncOpAll() { $id('op-all').checked = activeOperators.size === allOperatorNames.length; }
$id('op-all').onchange = function () {
    var on = this.checked;
    document.querySelectorAll('.op-cb').forEach(function (cb) { cb.checked = on; });
    activeOperators = on ? new Set(allOperatorNames) : new Set();
    restyleAll();
};
document.querySelectorAll('.op-cb').forEach(function (cb) {
    cb.onchange = function () {
        var op = this.getAttribute('data-op');
        this.checked ? activeOperators.add(op) : activeOperators.delete(op);
        syncOpAll(); restyleAll();
    };
});
$id('kinetic-toggle').onclick = function () {
    splitKinetic = !splitKinetic;
    $id('kinetic-sub').style.display = splitKinetic ? 'block' : 'none';
    this.textContent = splitKinetic ? 'Merge NZ Bus / Go Bus' : 'Split NZ Bus / Go Bus';
    restyleAll();
};
document.querySelectorAll('.ks-cb').forEach(function (cb) {
    cb.onchange = function () {
        var p = this.getAttribute('data-prefix');
        this.checked ? activeKineticSubs.add(p) : activeKineticSubs.delete(p);
        var k = document.querySelector('.op-cb[data-op="Kinetic"]');
        if (activeKineticSubs.size === 0) { activeOperators.delete('Kinetic'); k.checked = false; }
        else { activeOperators.add('Kinetic'); k.checked = true; }
        syncOpAll(); restyleAll();
    };
});

// ---------- Route filter chips ----------
function routeInfo(name) {
    for (var id in routes) {
        var r = routes[id];
        if ((r.route_short_name || r.route_long_name) === name) return r;
    }
    return null;
}
function renderChips() {
    var c = $id('chips');
    var names = Array.from(activeRoutes);
    c.innerHTML = names.map(function (n) {
        var r = routeInfo(n);
        var col = routeColour(n, r && r.route_long_name, r && r.route_type);
        return '<span class="chip"><span class="dot" style="background:' + col + '"></span>' + esc(n) +
            '<button data-route="' + esc(n) + '" aria-label="Remove ' + esc(n) + '">&times;</button></span>';
    }).join('') + (names.length > 1 ? '<span class="chip clear" id="chips-clear">Clear</span>' : '');
    c.querySelectorAll('button[data-route]').forEach(function (b) {
        b.onclick = function () { activeRoutes.delete(this.getAttribute('data-route')); routesChanged(); };
    });
    var cl = $id('chips-clear');
    if (cl) cl.onclick = function () { activeRoutes.clear(); routesChanged(); };
}
function routesChanged() { renderChips(); writeHash(); restyleAll(); }

function fitToRoute(name) {
    var pts = [];
    for (var id in markers) {
        var m = markers[id];
        if ((m.route_short_name || m.route_long_name) === name && map.hasLayer(m)) pts.push(m.getLatLng());
    }
    if (pts.length === 1) map.setView(pts[0], Math.max(map.getZoom(), 15));
    else if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [60, 60], maxZoom: 15 });
}

// ---------- Find ----------
var findInput = $id('find-input'), findResults = $id('find-results'), findClear = $id('find-clear');
var findItems = [], findActive = -1;

function routeNameList() {
    var seen = {}, list = [];
    for (var id in routes) {
        var r = routes[id], n = r.route_short_name || r.route_long_name;
        if (n && !seen[n]) { seen[n] = 1; list.push(r); }
    }
    return list;
}

function runFind() {
    var q = findInput.value.trim().toLowerCase();
    findClear.style.display = q ? 'block' : 'none';
    findItems = []; findActive = -1;
    if (!q) { findResults.style.display = 'none'; return; }

    // Routes: starts-with first, then contains (name or long name)
    var starts = [], contains = [];
    routeNameList().forEach(function (r) {
        var n = (r.route_short_name || r.route_long_name);
        var nl = n.toLowerCase(), ll = (r.route_long_name || '').toLowerCase();
        if (nl === q || nl.indexOf(q) === 0) starts.push(r);
        else if (nl.indexOf(q) > 0 || (q.length > 2 && ll.indexOf(q) >= 0)) contains.push(r);
    });
    starts.sort(function (a, b) { return (a.route_short_name || '').length - (b.route_short_name || '').length; });
    var rts = starts.concat(contains).slice(0, 6);

    // Vehicles: by fleet label, plate, or exact route name; nearest to map centre first
    var centre = map.getCenter(), vs = [];
    for (var id in markers) {
        var m = markers[id];
        var hit = (m.label || '').toLowerCase().indexOf(q) >= 0 ||
            (m.plate || '').toLowerCase().indexOf(q) >= 0 ||
            (m.route_short_name || '').toLowerCase() === q;
        if (hit) vs.push(m);
    }
    vs.sort(function (a, b) { return centre.distanceTo(a.getLatLng()) - centre.distanceTo(b.getLatLng()); });
    vs = vs.slice(0, 8);

    var html = '';
    if (rts.length) {
        html += '<div class="res-head">Routes</div>';
        rts.forEach(function (r) {
            var n = r.route_short_name || r.route_long_name;
            var live = 0;
            for (var id in markers) if ((markers[id].route_short_name || markers[id].route_long_name) === n) live++;
            findItems.push({ type: 'route', name: n });
            html += '<div class="res" data-i="' + (findItems.length - 1) + '"><span class="badge" style="background:' +
                routeColour(n, r.route_long_name, r.route_type) + '">' + esc(n) + '</span><div class="txt"><div class="sub">' +
                esc(r.route_long_name || '') + '</div><div class="sub">' + (live ? live + ' live' : 'None running now') + '</div></div></div>';
        });
    }
    if (vs.length) {
        html += '<div class="res-head">Vehicles</div>';
        vs.forEach(function (m) {
            findItems.push({ type: 'vehicle', id: m._entityId });
            var rn = m.route_short_name || '';
            html += '<div class="res" data-i="' + (findItems.length - 1) + '">' +
                (rn ? '<span class="badge" style="background:' + routeColour(rn, m.route_long_name, m.route_type) + '">' + esc(rn) + '</span>'
                    : '<span class="badge" style="background:#999">–</span>') +
                '<div class="txt"><div>' + esc(m.label) + '</div><div class="sub">' +
                esc([m.plate, m.headsign || (rn ? '' : 'Not in service')].filter(Boolean).join(' · ')) + '</div></div></div>';
        });
    }
    if (!html) html = '<div class="res-empty">No matching routes or vehicles</div>';
    findResults.innerHTML = html;
    findResults.style.display = 'block';
    findResults.querySelectorAll('.res').forEach(function (el) {
        el.onclick = function () { pickFind(+this.getAttribute('data-i')); };
    });
}

function pickFind(i) {
    var it = findItems[i];
    if (!it) return;
    findInput.value = ''; runFind(); findInput.blur();
    if (it.type === 'route') {
        activeRoutes.add(it.name);
        routesChanged();
        fitToRoute(it.name);
    } else {
        selectVehicle(it.id, true);
    }
}

findInput.addEventListener('input', runFind);
findInput.addEventListener('focus', function () { if (findInput.value) runFind(); });
findInput.addEventListener('keydown', function (e) {
    var els = findResults.querySelectorAll('.res');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!els.length) return;
        findActive = e.key === 'ArrowDown' ? Math.min(findActive + 1, els.length - 1) : Math.max(findActive - 1, 0);
        els.forEach(function (el, i) { el.classList.toggle('active', i === findActive); });
        els[findActive].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
        e.preventDefault();
        pickFind(findActive >= 0 ? findActive : 0);
    } else if (e.key === 'Escape') {
        findInput.value = ''; runFind(); findInput.blur();
    }
});
findClear.onclick = function () { findInput.value = ''; runFind(); findInput.focus(); };
map.on('click', function () { findResults.style.display = 'none'; findInput.blur(); });

// ---------- Vehicle popup ----------
function bikeText(v) { var n = parseInt(v, 10); return n === 1 ? 'Allowed' : n === 2 ? 'Not allowed' : 'Unknown'; }
function accessText(v) { var n = parseInt(v, 10); return n === 1 ? 'Accessible' : n === 2 ? 'Not accessible' : 'Unknown'; }

function popupHtml(m) {
    var rn = m.route_short_name;
    var title = m.headsign ? 'to ' + esc(m.headsign) : esc(m.route_long_name || 'Not in service');
    var rows = [
        ['Speed', m.speed + ' km/h'],
        ['Occupancy', m.occupancy_status != null ? occupancy[m.occupancy_status] : '—'],
        ['Plate', m.plate || '—'],
        ['Bikes', bikeText(m.bikes_allowed)],
        ['Access', accessText(m.accessibility)]
    ];
    if (m.headsign && m.route_long_name) rows.unshift(['Route', m.route_long_name]);
    return '<div class="vp-h">' +
        (rn ? '<span class="badge" style="background:' + routeColour(rn, m.route_long_name, m.route_type) + '">' + esc(rn) + '</span>' : '') +
        '<span>' + title + '</span></div>' +
        '<div class="vp-meta">' + esc(m.label) + (m.operator !== 'Unknown' ? ' · ' + esc(m.operator) : '') + '</div>' +
        '<div class="vp-grid">' + rows.map(function (r) { return '<span>' + r[0] + '</span><span>' + esc(r[1]) + '</span>'; }).join('') + '</div>' +
        '<div class="vp-follow"><span class="link" data-follow="' + esc(m._entityId) + '">' +
        (followId === m._entityId ? 'Stop following' : 'Follow this vehicle') + '</span></div>';
}

function refreshPopup(m) { if (m.isPopupOpen()) m.setPopupContent(popupHtml(m)); }

function loadTrip(m) {
    var tripId = m.trip && m.trip.trip_id;
    if (!tripId) return;
    function apply(a) {
        m.headsign = a.trip_headsign || m.headsign;
        var b = a.bike_allowed != null ? a.bike_allowed : a.bikes_allowed;
        if (b != null) m.bikes_allowed = b;
        var w = a.wheelchair_accessible != null ? a.wheelchair_accessible : a.wheelchair_access;
        if (w != null) m.accessibility = w;
        refreshPopup(m);
    }
    if (tripCache[tripId]) return apply(tripCache[tripId]);
    fetch('https://api.at.govt.nz/gtfs/v3/trips/' + encodeURIComponent(tripId), { headers: AT_HEADERS })
        .then(function (r) { return r.json(); })
        .then(function (j) {
            if (j.data && j.data.attributes) { tripCache[tripId] = j.data.attributes; apply(j.data.attributes); }
        })
        .catch(function (e) { console.error(e); });
}

document.addEventListener('click', function (e) {
    var f = e.target.closest && e.target.closest('[data-follow]');
    if (!f) return;
    var id = f.getAttribute('data-follow');
    followId = followId === id ? null : id;
    if (followId && markers[id]) map.panTo(markers[id].getLatLng());
    if (markers[id]) refreshPopup(markers[id]);
});
map.on('dragstart', function () {
    if (followId) { var m = markers[followId]; followId = null; if (m) refreshPopup(m); }
});

function selectVehicle(id, fly) {
    var m = markers[id];
    if (!m) return;
    if (!map.hasLayer(m._group)) map.addLayer(m._group);
    var go = function () { m.openPopup(); };
    if (fly) {
        followId = id;
        map.once('moveend', go);
        map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 16), { duration: 0.8 });
    } else go();
}

function createMarker(id, lat, lng) {
    var m = L.circleMarker([lat, lng], { radius: isTouch ? 8 : 6, weight: 2 });
    m._entityId = id;
    m.bindPopup('', { autoPanPadding: [20, 80], maxWidth: 280 });
    m.on('popupopen', function () {
        selectedId = id;
        styleMarker(m);
        m.setPopupContent(popupHtml(m));
        loadTrip(m);
    });
    m.on('popupclose', function () {
        if (selectedId === id) selectedId = null;
        if (followId === id) followId = null;
        styleMarker(m);
    });
    if (!isTouch) {
        m.bindTooltip('', { direction: 'top', offset: [0, -6] });
        m.on('popupopen', function () { m.closeTooltip(); });
    }
    return m;
}

// ---------- My location ----------
var me = { on: false, dot: null, ring: null, centered: false };
var locateBtn = $id('btn-locate');

function stopLocate() {
    map.stopLocate();
    me.on = false;
    locateBtn.classList.remove('on', 'busy');
    if (me.dot) { map.removeLayer(me.dot); map.removeLayer(me.ring); me.dot = me.ring = null; }
}
function startLocate() {
    if (!navigator.geolocation) return setStatus('Location not supported on this device', true);
    me.on = true; me.centered = false;
    locateBtn.classList.add('on', 'busy');
    map.locate({ watch: true, enableHighAccuracy: true, setView: false, maximumAge: 10000, timeout: 20000 });
}
locateBtn.onclick = function () {
    if (!me.on) return startLocate();
    // Already on: first tap re-centres, tapping again while centred turns it off
    if (me.dot && map.getBounds().pad(-0.3).contains(me.dot.getLatLng())) stopLocate();
    else if (me.dot) map.flyTo(me.dot.getLatLng(), Math.max(map.getZoom(), 15), { duration: 0.6 });
};
map.on('locationfound', function (e) {
    locateBtn.classList.remove('busy');
    if (!me.dot) {
        me.ring = L.circle(e.latlng, { radius: e.accuracy, weight: 1, color: '#1a73e8', fillOpacity: 0.08, interactive: false }).addTo(map);
        me.dot = L.circleMarker(e.latlng, { radius: 7, weight: 3, color: '#fff', fillColor: '#1a73e8', fillOpacity: 1, interactive: false }).addTo(map);
    } else {
        me.dot.setLatLng(e.latlng); me.ring.setLatLng(e.latlng).setRadius(e.accuracy);
    }
    if (!me.centered) {
        me.centered = true;
        map.flyTo(e.latlng, Math.max(map.getZoom(), 15), { duration: 0.8 });
    }
});
map.on('locationerror', function (e) {
    stopLocate();
    var msg = e.code === 1 ? 'Location permission denied' :
        location.protocol !== 'https:' && location.hostname !== 'localhost' ? 'Location needs HTTPS' : 'Couldn’t get your location';
    setStatus(msg, true);
});
// If location was already granted on a previous visit, show it straight away
if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'geolocation' }).then(function (p) {
        if (p.state === 'granted') startLocate();
    }).catch(function () {});
}

// ---------- Status ----------
var lastUpdate = null, lastCount = 0, statusErr = null;
function setStatus(msg, err) {
    statusErr = err ? msg : null;
    var el = $id('status');
    el.textContent = msg;
    el.classList.toggle('err', !!err);
    if (err) setTimeout(function () { if (statusErr === msg) { statusErr = null; renderStatus(); } }, 5000);
}
function renderStatus() {
    if (statusErr || !lastUpdate) return;
    var s = Math.round((Date.now() - lastUpdate) / 1000);
    var el = $id('status');
    el.classList.remove('err');
    el.textContent = lastCount + ' vehicles · ' + (s < 5 ? 'just now' : s < 60 ? s + 's ago' : Math.round(s / 60) + 'm ago');
}
setInterval(renderStatus, 1000);

// ---------- Data ----------
var inFlight = false;
var refreshBtn = $id('btn-refresh');
refreshBtn.onclick = function () { loop(true); };

fetch('https://api.at.govt.nz/gtfs/v3/routes', { headers: AT_HEADERS })
    .then(function (r) { return r.json(); })
    .then(function (res) {
        if (res.message) { console.error(res); setStatus('Error getting routes: ' + res.message, true); }
        else res.data.forEach(function (r) {
            if (r.attributes.route_type == 712) r.attributes.route_type = 3;
            routes[r.id] = r.attributes;
        });
        renderChips();
        loop(true);
    })
    .catch(function (e) { console.error(e); setStatus('Error loading routes', true); loop(true); });

function loop(force) {
    if (inFlight) return;
    if (!force && document.hidden) return;
    inFlight = true;
    refreshBtn.classList.add('busy');

    fetch('https://api.at.govt.nz/realtime/legacy/vehiclelocations', { headers: AT_HEADERS })
        .then(function (r) { return r.json(); })
        .then(function (data) {
            if (!data || !data.response || !Array.isArray(data.response.entity)) {
                console.error('Unexpected vehiclelocations response', data);
                return setStatus('Unexpected vehicle data', true);
            }
            var seen = {};
            data.response.entity.forEach(function (ent) { update(ent, seen); });

            // Drop vehicles no longer in the feed
            for (var id in markers) {
                if (seen[id]) continue;
                markers[id]._group.removeLayer(markers[id]);
                if (followId === id) followId = null;
                if (selectedId === id) selectedId = null;
                delete markers[id];
            }
            lastCount = Object.keys(seen).length;
            lastUpdate = Date.now();
            renderStatus();

            if (followId && markers[followId]) map.panTo(markers[followId].getLatLng(), { animate: true });
            if (findResults.style.display === 'block') runFind();
        })
        .catch(function (e) { console.error(e); setStatus('Error loading vehicles', true); })
        .then(function () { inFlight = false; refreshBtn.classList.remove('busy'); });
}

function update(ent, seen) {
    var v = ent.vehicle;
    if (!v || !v.position || typeof v.position.latitude !== 'number') return;
    var id = String(ent.id);
    seen[id] = true;
    var info = v.vehicle || {};
    var ll = [v.position.latitude, v.position.longitude];

    var m = markers[id];
    if (!m) m = markers[id] = createMarker(id, ll[0], ll[1]);
    else m.setLatLng(ll);

    m.label = info.label || ('id ' + id);
    m.plate = info.license_plate || '';
    m.prefix = m.label.substring(0, 2).toUpperCase();
    m.speed = Math.round(v.position.speed || 0);
    m.occupancy_status = v.occupancy_status;

    var group = layers[null];
    var prevTrip = m.trip && m.trip.trip_id;
    m.trip = v.trip || null;
    if (!m.trip || m.trip.trip_id !== prevTrip) m.headsign = null;
    m.route_short_name = m.route_long_name = m.route_type = null;
    m.vehicle_type = null;

    var r = m.trip && routes[m.trip.route_id];
    if (r) {
        m.route_short_name = r.route_short_name;
        m.route_long_name = r.route_long_name;
        m.route_type = m.vehicle_type = r.route_type;
        group = layers[r.route_type] || layers[null];
    } else if (/^(AMP|AMA|AMT)/i.test(m.label)) {
        group = layers.oos_train; m.vehicle_type = 2;
    } else if (/^ZM/i.test(m.plate)) {
        group = layers.oos_ferry; m.vehicle_type = 4;
    } else if (m.plate) {
        group = layers.oos_bus; m.vehicle_type = 3;
    }
    if (m._group !== group) {
        if (m._group) m._group.removeLayer(m);
        group.addLayer(m);
        m._group = group;
    }

    m.operator = m.vehicle_type === 2 ? 'Auckland One Rail' : getOperator(m.label);
    if (m.bikes_allowed == null) m.bikes_allowed = v.bike_allowed != null ? v.bike_allowed : v.bikes_allowed;
    if (m.accessibility == null) m.accessibility = v.wheelchair_accessible != null ? v.wheelchair_accessible : info.wheelchair_accessible;

    if (!isTouch) m.setTooltipContent('<b>' + esc(m.route_short_name || '–') + '</b> ' + esc(m.label));
    if (m.isPopupOpen()) {
        if (m.trip && !m.headsign) loadTrip(m);
        refreshPopup(m);
    }
    styleMarker(m);
}

setInterval(loop, 10000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) loop(true); });
</script>
</body>
</html>
